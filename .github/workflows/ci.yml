name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 같은 ref의 진행 중인 run은 취소 (중복 빌드 방지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: validate → test → lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: 의존성 설치
        run: npm ci

      - name: 데이터 검증 (validate)
        run: npm run validate

      - name: 테스트 (vitest)
        run: npm test

      - name: 린트 (eslint)
        run: npm run lint

      # 빌드는 여기서 하지 않는다 — push 마다 세 번(husky pre-push·CI·Cloudflare) 돌던 것을
      # 둘로 줄였다(2026-09-03). 빌드 검증과 페이로드 가드는 .husky/pre-push 가, 배포 빌드는
      # Cloudflare Workers Builds 가 맡는다.
